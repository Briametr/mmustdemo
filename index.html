<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">
    <title>mmust university Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
<script>
  if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
      .then(function(registration) {
          console.log('Service Worker Registered!');
      })
      .catch(function(error) {
          console.log('Registration failed:', error);
      });
  }
</script>

    <div class="login-container">
        <img src="https://www.google.com/url?sa=i&url=http%3A%2F%2Fapplication.mmust.ac.ke%2F&psig=AOvVaw31msHfOaB_GcD50wnqkscp&ust=1746264040456000&source=images&cd=vfe&opi=89978449&ved=0CBEQjRxqFwoTCLDb68-6hI0DFQAAAAAdAAAAABAE" alt="MMUST Logo" class="logo">
        
        
    
    <h1>Welcome to softcore university</h1>
</div>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
