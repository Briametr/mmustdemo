<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="manifest.json">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta charset="UTF-8">
    <title>softcore university Login</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/script.js" defer></script>
</head>
<body>
<script>
  if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js')
      .then(function(registration) {
          console.log('Service Worker Registered!');
      })
      .catch(function(error) {
          console.log('Registration failed:', error);
      });
  }
</script>

    <div class="login-container">
        <img src="https://logo.com/stitch/new-logo?variables=%257B%2522text%2522%253A%257B%2522wordmark%2522%253A%2522softcore%2520university%2522%257D%252C%2522icon_i" alt="MMUST Logo" class="logo">
        
        
    
    <h1>Welcome to softcore university</h1>
</div>

        <form id="loginForm">
            <input type="text" id="username" placeholder="Username" required>
            <input type="password" id="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
